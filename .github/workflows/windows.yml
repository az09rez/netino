name: Build Windows

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/configs.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # attach the installer to the release the Android workflow publishes
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installer and portable app
        run: ./gradlew --no-daemon -p desktop packageMsi createDistributable

      # The real app on Windows: xray.exe, the proxy setting, DPAPI and every tab of the window
      - name: Self-test
        run: |
          cd desktop/build/compose/binaries/main/app/Netino
          rm -f "$APPDATA/Netino/selftest.txt"
          timeout 180 ./Netino.exe --selftest || true
          cat "$APPDATA/Netino/selftest.txt"
          ! grep -q '^FAIL' "$APPDATA/Netino/selftest.txt"
          grep -q '^PASS window' "$APPDATA/Netino/selftest.txt"

      - name: Collect files
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/Netino-$version-windows-x64.msi"
          # Portable: unzip anywhere and run Netino.exe (no installation, no admin rights)
          (cd desktop/build/compose/binaries/main/app && 7z a -tzip -mx=7 "../../../../../../dist/Netino-$version-windows-x64-portable.zip" Netino > /dev/null)
          (cd dist && sha256sum * > SHA256SUMS-windows.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Netino-${{ env.VERSION }}-windows
          path: dist/
          if-no-files-found: error

      # main: the Android workflow creates the release v<version>; the Windows files are added to it
      - name: Attach to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          for i in $(seq 1 60); do
            gh release view "$tag" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$tag" dist/* --clobber
