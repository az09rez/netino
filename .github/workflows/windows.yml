name: Build Windows

on:
  push:
    branches: ["**"]
    # The Windows app and the Android code it shares
    paths:
      - "desktop/**"
      - "app/src/main/java/com/netino/vpn/core/**"
      - "app/src/main/java/com/netino/vpn/data/**"
      - "app/src/main/res/font/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # publishes the Windows release
    defaults:
      run:
        shell: bash
    env:
      # Optional code signing (removes the SmartScreen warning): a .pfx certificate as Base64, and its password
      WIN_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WIN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The connection core's unit tests (state machine, reconnect policy, scoring) before anything is built
      - name: Unit tests
        run: ./gradlew --no-daemon -p desktop test

      - name: Build installer and portable app
        run: ./gradlew --no-daemon -p desktop packageMsi createDistributable

      # The real app on Windows: xray.exe, the proxy setting, the full tunnel (the runner is administrator), DPAPI, every tab
      - name: Self-test
        run: |
          cd desktop/build/compose/binaries/main/app/Netino
          rm -f "$APPDATA/Netino/selftest.txt"
          timeout 300 ./Netino.exe --selftest || true
          cat "$APPDATA/Netino/selftest.txt"
          if grep -q '^FAIL' "$APPDATA/Netino/selftest.txt"; then exit 1; fi
          grep -q '^PASS window' "$APPDATA/Netino/selftest.txt"

      # The installer and the portable app's launcher, when a certificate is set up (the installed copy needs none:
      # SmartScreen only checks downloaded files)
      - name: Sign
        if: env.WIN_PFX != ''
        run: |
          printf %s "$WIN_PFX" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/cert.pfx"
          signtool=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)
          for f in desktop/build/compose/binaries/main/msi/*.msi desktop/build/compose/binaries/main/app/Netino/Netino.exe; do
            "$signtool" sign //fd sha256 //tr http://timestamp.digicert.com //td sha256 //f "$(cygpath -w "$RUNNER_TEMP/cert.pfx")" //p "$WIN_PFX_PASSWORD" "$(cygpath -w "$f")"
          done
          rm -f "$RUNNER_TEMP/cert.pfx"

      - name: Collect files
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)".*/\1/p' desktop/build.gradle.kts)
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/Netino-$version-windows-x64.msi"
          # Portable: unzip anywhere and run Netino.exe (no installation, no admin rights)
          # Marks the portable copy: its updater downloads the new zip instead of running the installer
          echo portable > desktop/build/compose/binaries/main/app/Netino/app/portable
          (cd desktop/build/compose/binaries/main/app && 7z a -tzip -mx=7 "../../../../../../dist/Netino-$version-windows-x64-portable.zip" Netino > /dev/null)
          (cd dist && sha256sum * > SHA256SUMS-windows.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist
          # What the download is made of (to keep it small)
          (cd desktop/build/compose/binaries/main/app/Netino && du -sh runtime app/* | sort -h | tail -12)

      - uses: actions/upload-artifact@v4
        with:
          name: Netino-${{ env.VERSION }}-windows
          path: dist/
          if-no-files-found: error

      # main carrying a Windows version that has no release yet: publish "windows-v<version>" (the Android
      # releases are "v<version>"; each app's updater only looks at its own)
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"; exit 0
          fi
          # Notes: this version's section of the README ("## تغییرات ویندوز <version>")
          awk -v h="## تغییرات ویندوز $VERSION" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' README.md > notes.md
          [ -s notes.md ] || echo "Netino for Windows $VERSION" > notes.md
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Netino for Windows $VERSION" --notes-file notes.md
