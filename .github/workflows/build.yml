name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # The collector and its list don't change the app
    paths-ignore:
      - "tools/**"
      - ".github/workflows/configs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish a GitHub Release on v* tags
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Release signing key comes only from GitHub Secrets; it never touches the repository.
      # Without the secrets (e.g. pull requests from forks) a debug-signed APK is built instead.
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          # Strip line breaks/spaces (a value copied on Windows ends with \r\n)
          if ! printf %s "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/keystore/release.jks; then
            # Only lengths are printed, never the secret itself
            b64=$(printf %s "$KEYSTORE_BASE64" | tr -d '[:space:]')
            bad=$(printf %s "$b64" | tr -d 'A-Za-z0-9+/=' | wc -c)
            echo "::error::KEYSTORE_BASE64 is not valid Base64 of the .jks file (length ${#b64}, ${bad} non-Base64 characters)."
            exit 1
          fi
          if ! keytool -list -keystore app/keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore could not be opened: check KEYSTORE_PASSWORD and KEY_ALIAS."
            exit 1
          fi
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon assembleRelease
            echo "APK_DIR=app/build/outputs/apk/release" >> "$GITHUB_ENV"
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon assembleDebug
            echo "APK_DIR=app/build/outputs/apk/debug" >> "$GITHUB_ENV"
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Rename APKs
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          suffix=$([ "$VARIANT" = debug ] && echo "-debug" || true)
          mkdir -p dist
          for f in "$APK_DIR"/*.apk; do
            abi=$(basename "$f" .apk | sed -e "s/^app-//" -e "s/-$VARIANT$//")
            cp "$f" "dist/Netino-$version-$abi$suffix.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Netino-${{ env.VERSION }}-${{ env.VARIANT }}
          path: dist/
          if-no-files-found: error

      - name: Clean up signing key
        if: always()
        run: rm -rf app/keystore keystore.properties

      # A v* tag, or main carrying a versionName that has no release yet, publishes a GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"; exit 0
          fi
          if [ "$VARIANT" != release ]; then
            echo "::error::Signing secrets are missing; refusing to publish an unsigned release."
            exit 1
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Netino $VERSION" --generate-notes
