<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نتینو ویندوز — ابزارها</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
<style>
body{margin:0}
a{color:#6AB0FF}a:hover{color:#9CCBFF}
button,input{font-family:inherit}
input::placeholder{color:#8C98AD}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
</style>
</helmet>
<div dir="rtl" style="width: 1000px; height: 720px; box-sizing: border-box; background: #0A0F1C; color: #E5EAF3; font-family: 'Vazirmatn', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #253047">
  <div aria-hidden="true" style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; color: #9AA6BA; flex-shrink: 0">
    <img src="/_blob/5644abea1ce12769d11482a20bb3cea4" alt="" style="width: 16px; height: 16px"><span style="flex-grow: 1">نتینو</span>
    <span class="ms" style="font-size: 16px; width: 40px; text-align: center">remove</span><span class="ms" style="font-size: 16px; width: 40px; text-align: center">crop_square</span><span class="ms" style="font-size: 16px; width: 40px; text-align: center">close</span>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex">
    <nav aria-label="منوی اصلی" style="width: 88px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: #0F1626">
      <img src="/_blob/5644abea1ce12769d11482a20bb3cea4" alt="نتینو" style="width: 40px; height: 40px; margin-bottom: 12px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; width: 100%; text-decoration: none; font-size: 13px; font-weight: {{n.weight}}; color: {{n.fg}}">
          <span style="width: 64px; height: 36px; border-radius: 18px; background: {{n.pill}}; color: {{n.iconFg}}; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 28px">{{n.icon}}</span></span>{{n.label}}
        </a>
      </sc-for>
    </nav>

    <main style="flex-grow: 1; min-width: 0; overflow-y: auto; padding: 16px 24px 20px; display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600">ابزارها</h1>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start">

        <section style="border-radius: 24px; background: #131B2D; padding: 18px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 8px"><span class="ms" aria-hidden="true" style="color: #6AB0FF">cloud</span><h2 style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600">آی‌پی تمیز کلودفلر</h2></div>
          <div role="radiogroup" aria-label="نوع آی‌پی" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #3A4660; border-radius: 20px; overflow: hidden">
            <button role="radio" aria-checked="true" style="height: 40px; border: 0; background: #0D3F78; color: #D6E7FF; font-size: 14px; font-weight: 600">✓ IPv4</button>
            <button role="radio" aria-checked="false" style="height: 40px; border: 0; background: transparent; color: #E5EAF3; font-size: 14px">IPv6</button>
          </div>
          <div style="display: flex; align-items: center; gap: 10px">
            <div role="progressbar" aria-label="جست‌وجوی آی‌پی ۳۲۰ از ۱۰۰۰" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="320" style="flex-grow: 1; height: 6px; border-radius: 3px; background: #0D3F78; overflow: hidden"><span style="display: block; width: 32%; height: 100%; background: #6AB0FF"></span></div>
            <span style="font-size: 13px; color: #9AA6BA">۳۲۰/۱۰۰۰</span>
            <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: transparent; color: #6AB0FF; font-size: 14px">توقف</button>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0; border-radius: 14px; background: #0F1626">
            <sc-for list="{{ips}}" as="ip" hint-placeholder-count="4">
              <li style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-top: {{ip.div}}">
                <span class="mono" style="flex-grow: 1; font-size: 14px; text-align: right">{{ip.addr}}</span>
                <span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #123A22; color: #4ADE80; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">{{ip.ms}}</span>
                <button aria-label="کپی {{ip.addr}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; color: #9AA6BA"><span class="ms" aria-hidden="true" style="font-size: 18px">content_copy</span></button>
              </li>
            </sc-for>
          </ul>
        </section>

        <section style="border-radius: 24px; background: #131B2D; padding: 18px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 8px"><span class="ms" aria-hidden="true" style="color: #9BE05A">bolt</span><h2 style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600">WARP</h2></div>
          <div role="radiogroup" aria-label="نوع WARP" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #3A4660; border-radius: 20px; overflow: hidden">
            <button role="radio" aria-checked="true" style="height: 40px; border: 0; background: #0D3F78; color: #D6E7FF; font-size: 14px; font-weight: 600">✓ WARP در WARP</button>
            <button role="radio" aria-checked="false" style="height: 40px; border: 0; background: transparent; color: #E5EAF3; font-size: 14px">ساده</button>
          </div>
          <span style="font-size: 14px; color: #9AA6BA">خروج از WARP</span>
          <div role="radiogroup" aria-label="خروج از WARP" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #3A4660; border-radius: 20px; overflow: hidden">
            <button role="radio" aria-checked="false" style="height: 40px; border: 0; background: transparent; color: #E5EAF3; font-size: 14px">خاموش</button>
            <button role="radio" aria-checked="true" style="height: 40px; border: 0; border-inline: 1px solid #3A4660; background: #0D3F78; color: #D6E7FF; font-size: 14px; font-weight: 600">✓ بعضی سایت‌ها</button>
            <button role="radio" aria-checked="false" style="height: 40px; border: 0; background: transparent; color: #E5EAF3; font-size: 14px">همه</button>
          </div>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #9AA6BA">کلید WARP+ (اختیاری)
            <input class="mono" placeholder="xxxxxxxx-xxxxxxxx-xxxxxxxx" style="height: 44px; border-radius: 12px; border: 1px solid #3A4660; background: #0F1626; color: #E5EAF3; padding: 0 12px; font-size: 14px">
          </label>
          <button style="height: 48px; border-radius: 18px; border: 0; background: #6AB0FF; color: #00315F; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true">add_circle</span>ساختن سرورهای WARP جدید</button>
        </section>

        <section style="border-radius: 24px; background: #131B2D; padding: 18px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 8px"><span class="ms" aria-hidden="true" style="color: #6AB0FF">backup</span><h2 style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600">پشتیبان‌گیری</h2></div>
          <span style="font-size: 14px; color: #9AA6BA; line-height: 1.8">همان فایل <span class="mono">.nbk</span> گوشی؛ با رمز محافظت می‌شود.</span>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button style="height: 48px; border-radius: 18px; border: 0; background: #0D3F78; color: #D6E7FF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">save</span>ساختن پشتیبان</button>
            <button style="height: 48px; border-radius: 18px; border: 1px solid #3A4660; background: transparent; color: #E5EAF3; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">restore</span>بازگردانی</button>
          </div>
        </section>

        <section style="border-radius: 24px; background: #131B2D; padding: 6px 0">
          <div style="display: flex; align-items: center; gap: 8px; padding: 12px 18px 4px"><span class="ms" aria-hidden="true" style="color: #6AB0FF">notifications</span><h2 style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600">حریم خصوصی و اعلان‌ها</h2></div>
          <sc-for list="{{prefs}}" as="p" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 4px 18px">
              <span id="{{p.id}}" style="flex-grow: 1; font-size: 15px">{{p.label}}</span>
              <button role="switch" aria-checked="{{p.on}}" aria-labelledby="{{p.id}}" style="position: relative; width: 52px; height: 32px; padding: 0; border-radius: 16px; background: {{p.track}}; border: 2px solid {{p.border}}; box-sizing: border-box; flex-shrink: 0"><span style="position: absolute; top: 50%; {{p.side}}: {{p.off}}px; width: {{p.k}}px; height: {{p.k}}px; margin-top: {{p.mt}}px; border-radius: 50%; background: {{p.knob}}"></span></button>
            </div>
          </sc-for>
          <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 4px 18px">
            <span style="flex-grow: 1; font-size: 15px">کلید میانبر اتصال</span>
            <span class="mono" style="height: 32px; padding: 0 12px; border-radius: 10px; background: #1A2438; border: 1px solid #3A4660; font-size: 13px; display: inline-flex; align-items: center">Ctrl + Alt + N</span>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const sw = (id, label, on) => ({ id, label, on, track: on ? '#6AB0FF' : 'transparent', border: on ? '#6AB0FF' : '#8C98AD', knob: on ? '#00315F' : '#8C98AD', side: on ? 'left' : 'right', off: on ? 2 : 6, k: on ? 24 : 16, mt: on ? -12 : -8 });
    return {
      ips: ['104.18.32.47', '172.67.181.9', '104.21.66.120', '188.114.97.3'].map((addr, i) => ({ addr, ms: ['۱۸۴ms', '۲۱۲ms', '۲۴۰ms', '۲۹۸ms'][i], div: i ? '1px solid #253047' : '0' })),
      prefs: [
        sw('pf-free', 'کمک به لیست رایگان (بی‌نام)', true),
        sw('pf-notif', 'اعلان‌های ویندوز', true),
        sw('pf-hk', 'فعال بودن کلید میانبر', true)
      ],
      nav: [['خانه', 'shield', 'W-Home.dc.html'], ['سرورها', 'dns', 'W-Servers.dc.html'], ['آمار', 'bar_chart', '#'], ['ابزارها', 'build', 'W-Tools.dc.html'], ['تنظیمات', 'settings', 'W-Settings.dc.html'], ['گزارش', 'receipt_long', '#']].map((n, k) => ({
        label: n[0], icon: n[1], href: n[2], current: k === 3 ? 'page' : 'false',
        pill: k === 3 ? '#0D3F78' : 'transparent', iconFg: k === 3 ? '#D6E7FF' : '#9AA6BA', fg: k === 3 ? '#E5EAF3' : '#9AA6BA', weight: k === 3 ? 600 : 500
      }))
    };
  }
}
</script>
</body>
</html>
