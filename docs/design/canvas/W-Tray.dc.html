<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نتینو ویندوز — سینی سیستم</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
<style>
body{margin:0}
button{font-family:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid #1A73D9;outline-offset:2px}
.mi:hover{background:#EFF3F9}
</style>
</helmet>
<div dir="{{dir}}" style="position: relative; width: 520px; height: 560px; box-sizing: border-box; background: #24324A; color: #0F172A; font-family: 'Vazirmatn', system-ui, sans-serif; overflow: hidden">

  <div role="alert" style="position: absolute; top: 20px; {{endSide}}: 20px; width: 340px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 8px 28px rgba(0,0,0,0.35); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4B5567"><img src="/_blob/5644abea1ce12769d11482a20bb3cea4" alt="" style="width: 16px; height: 16px">{{s.app}}<span style="flex: 1"></span>{{s.now}}</div>
    <span style="font-size: 15px; font-weight: 700">{{s.toastT}}</span>
    <span style="font-size: 14px; color: #4B5567; line-height: 1.6">{{s.toastB}}</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="min-height: 36px; border-radius: 6px; border: 0; background: #1A73D9; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">{{s.toastA}}</button>
      <button style="min-height: 36px; border-radius: 6px; border: 1px solid #C3CDDC; background: #FFFFFF; font-size: 13px; cursor: pointer">{{s.toastB2}}</button>
    </div>
  </div>

  <div role="dialog" aria-label="{{s.app}}" style="position: absolute; bottom: 60px; {{endSide}}: 16px; width: 300px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 12px 32px rgba(0,0,0,0.4); padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <button aria-label="{{s.disconnect}}" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: linear-gradient(135deg, #1E88E5, #42A5F5 55%, #7CC531); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><span class="ms" aria-hidden="true" style="font-size: 26px">power_settings_new</span></button>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700; color: #1B7F38">{{s.connected}}</span><span style="font-size: 13px; color: #4B5567">{{s.server}}</span></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="min-height: 40px; border-radius: 10px; border: 0; background: #D6E7FF; color: #0A3A73; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><span class="ms" aria-hidden="true" style="font-size: 18px">speed</span>{{s.fastest}}</button>
      <button style="min-height: 40px; border-radius: 10px; border: 0; background: #EFF3F9; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><span class="ms" aria-hidden="true" style="font-size: 18px">bolt</span>WARP</button>
    </div>
    <div style="height: 1px; background: #DCE3EE"></div>
    <div role="menu" style="display: flex; flex-direction: column">
      <button class="mi" role="menuitem" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 8px; border: 0; background: transparent; font-size: 14px; text-align: start; cursor: pointer"><span class="ms" aria-hidden="true" style="font-size: 20px; color: #4B5567">open_in_new</span><span style="flex: 1">{{s.show}}</span></button>
      <button class="mi" role="menuitem" style="min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 8px; border: 0; background: transparent; font-size: 14px; text-align: start; cursor: pointer"><span class="ms" aria-hidden="true" style="font-size: 20px; color: #4B5567">logout</span><span style="flex: 1">{{s.quit}}</span></button>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #101826; display: flex; flex-direction: row-reverse; align-items: center; gap: 4px; padding: 0 12px; color: #C9D2E0; font-size: 12px">
    <span style="display: flex; flex-direction: column; align-items: center; line-height: 1.3; padding: 0 8px">{{s.time}}<span>{{s.date}}</span></span>
    <span class="ms" style="font-size: 18px">volume_up</span>
    <span class="ms" style="font-size: 18px">wifi</span>
    <span style="width: 32px; height: 32px; border-radius: 6px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; position: relative">
      <img src="/_blob/5644abea1ce12769d11482a20bb3cea4" alt="" style="width: 20px; height: 20px">
      <span style="position: absolute; bottom: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: #22A447; border: 1.5px solid #101826"></span>
    </span>
    <span class="ms" style="font-size: 18px">expand_less</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fa","en"],"default":"fa"},"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const fa = (this.props.lang ?? 'fa') === 'fa';
    const S = fa ? {
      app: 'نتینو', now: 'همین الان', toastT: 'اتصال قطع شد', toastB: 'قطع امن اینترنت را بسته نگه داشته. سرور دیگری امتحان می‌کنیم.', toastA: 'اتصال به سریع‌ترین', toastB2: 'باز کردن اینترنت',
      disconnect: 'قطع اتصال', connected: 'متصل و امن', server: 'آلمان ۲ · ۰۰:۱۲:۴۸', fastest: 'سریع‌ترین', show: 'نمایش نتینو', quit: 'خروج', time: '۱۴:۳۲', date: '۱۴۰۵/۰۸/۱۴'
    } : {
      app: 'Netino', now: 'Now', toastT: 'Connection dropped', toastB: "The kill switch is keeping the internet blocked. We're trying another server.", toastA: 'Connect to fastest', toastB2: 'Unblock internet',
      disconnect: 'Disconnect', connected: 'Connected', server: 'Germany 2 · 00:12:48', fastest: 'Fastest', show: 'Show Netino', quit: 'Quit', time: '2:32 PM', date: '11/5/2026'
    };
    return { s: S, dir: fa ? 'rtl' : 'ltr', endSide: fa ? 'left' : 'right' };
  }
}
</script>
</body>
</html>
