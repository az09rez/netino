<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نتینو — ضد فیلترینگ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
<style>
body{margin:0}
a{color:#1A73D9}a:hover{color:#0F5BB5}
button{font-family:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
</style>
</helmet>
<div dir="rtl" style="width: 412px; height: 915px; box-sizing: border-box; background: {{t.bg}}; color: {{t.on}}; font-family: 'Vazirmatn', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 4px; min-height: 64px">
    <a href="A-Settings.dc.html" aria-label="برگشت" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: {{t.on}}"><span class="ms" aria-hidden="true">arrow_forward</span></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 600">ضد فیلترینگ</h1>
  </header>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 8px; font-size: 15px; font-weight: 600; color: {{t.primary}}">{{g.title}}</h2>
        <div style="border-radius: 24px; background: {{t.sc}}; padding: 4px 0">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 10px 16px; border-top: {{it.divider}}">
              <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
                <span id="{{it.id}}" style="font-size: 17px; font-weight: 500">{{it.label}}</span>
                <span style="font-size: 14px; color: {{t.onv}}; line-height: 1.7">{{it.hint}}</span>
              </span>
              <sc-if value="{{it.isSwitch}}" hint-placeholder-val="{{true}}">
                <button role="switch" aria-checked="{{it.on}}" aria-labelledby="{{it.id}}" onClick="{{it.flip}}" style="position: relative; width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: 2px solid {{it.trackBorder}}; box-sizing: border-box; background: {{it.track}}; padding: 0; cursor: pointer">
                  <span style="position: absolute; top: 50%; {{it.side}}: {{it.offset}}px; width: {{it.knob}}px; height: {{it.knob}}px; margin-top: {{it.knobMt}}px; border-radius: 50%; background: {{it.knobBg}}"></span>
                </button>
              </sc-if>
              <sc-if value="{{it.isAction}}" hint-placeholder-val="{{false}}">
                <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: {{t.pc}}; color: {{t.onPc}}; font-size: 14px; font-weight: 600; flex-shrink: 0; cursor: pointer">{{it.action}}</button>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <sc-if value="{{fragOn}}" hint-placeholder-val="{{true}}">
      <section style="border-radius: 24px; background: {{t.sc}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 15px; font-weight: 600">تنظیم فرگمنت</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: {{t.onv}}">طول تکه‌ها
            <input value="10-30" class="mono" style="height: 48px; border-radius: 12px; border: 1px solid {{t.outline}}; background: {{t.bg}}; color: {{t.on}}; padding: 0 12px; font-size: 15px; text-align: right">
          </label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: {{t.onv}}">فاصله (ms)
            <input value="10-20" class="mono" style="height: 48px; border-radius: 12px; border: 1px solid {{t.outline}}; background: {{t.bg}}; color: {{t.on}}; padding: 0 12px; font-size: 15px; text-align: right">
          </label>
        </div>
      </section>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { warpPlus: false, wiw: true, cfAuto: true, frag: true, cleanAuto: true };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const t = dark
      ? { bg: '#0A0F1C', sc: '#131B2D', on: '#E5EAF3', onv: '#9AA6BA', primary: '#6AB0FF', onPrimary: '#00315F', pc: '#0D3F78', onPc: '#D6E7FF', outline: '#3A4660', offKnob: '#9AA6BA' }
      : { bg: '#F6F8FC', sc: '#EFF3F9', on: '#0F172A', onv: '#4B5567', primary: '#1A73D9', onPrimary: '#FFFFFF', pc: '#D6E7FF', onPc: '#0A3A73', outline: '#6B7487', offKnob: '#6B7487' };
    const sw = (key, label, hint) => {
      const on = !!this.state[key];
      return {
        id: 'sw-' + key, label, hint, isSwitch: true, isAction: false, on,
        track: on ? t.primary : 'transparent', trackBorder: on ? t.primary : t.outline,
        knob: on ? 24 : 16, knobMt: on ? -12 : -8, offset: on ? 2 : 6,
        side: on ? 'left' : 'right', knobBg: on ? t.onPrimary : t.offKnob,
        flip: () => this.setState({ [key]: !on })
      };
    };
    const act = (id, label, hint, action) => ({ id, label, hint, action, isSwitch: false, isAction: true });
    const div = (arr) => arr.map((x, i) => ({ ...x, divider: i ? '1px solid ' + (dark ? '#253047' : '#DCE3EE') : '0' }));
    return {
      t,
      fragOn: !!this.state.frag,
      groups: [
        { title: 'WARP', items: div([
          act('mk', 'ساختن سرورهای WARP', 'حساب WARP رایگان کلودفلر ساخته و به سرورها اضافه می‌شود.', 'ساختن'),
          sw('warpPlus', 'WARP+', 'اگر کلید WARP+ دارید، سرعت بیشتر می‌شود.'),
          sw('wiw', 'WARP در WARP', 'دو لایه؛ وقتی WARP ساده مسدود است کمک می‌کند.')
        ]) },
        { title: 'مسیر کلودفلر و آی‌پی تمیز', items: div([
          sw('cfAuto', 'انتخاب خودکار مسیر کلودفلر', 'نتینو بهترین مسیر را برای این اپراتور پیدا می‌کند.'),
          sw('cleanAuto', 'آی‌پی تمیز خودکار', 'آی‌پی کلودفلری که روی شبکهٔ شما باز است جایگزین می‌شود.'),
          act('scan', 'جست‌وجوی آی‌پی تمیز', 'آخرین نتیجه: ۱۲ آی‌پی سالم · امروز', 'جست‌وجو')
        ]) },
        { title: 'فرگمنت', items: div([
          sw('frag', 'فرگمنت TLS', 'بستهٔ اول تکه‌تکه فرستاده می‌شود تا فیلتر آن را نشناسد.')
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
