    const chipIds = ['all', 'mine', 'free', 'sub', 'group', 'warp'];
    const px = fa ? '' : 'EN-';
    const navHref = ['W-Home.dc.html', 'W-Servers.dc.html', 'W-Usage.dc.html', 'W-Settings.dc.html'];
    const navIcon = ['shield', 'dns', 'data_usage', 'settings'];
    return {
      s: S, t, px,
      dir: fa ? 'rtl' : 'ltr',
      chips: chipIds.map((id, i) => {
        const on = id === chip;
        return { label: S.chips[i], on, bg: on ? t.pc : 'transparent', fg: on ? t.onpc : t.on, border: on ? t.pc : t.line2, w: on ? 600 : 500, pick: () => this.setState({ chip: id }) };
      }),
      groups: defs.filter((g) => show.includes(g.id)).map((g) => ({
        ...g, isSub: !!g.isSub, hasMore: !!g.hasMore, moreLabel: S.showFree,
        metaFg: g.isSub ? t.warn : t.onv, metaW: g.isSub ? 600 : 400,
        more: () => this.setState({ freeOpen: true }),
        rows: g.ids.map(row)
      })),
      d: { ...d, fromSub: !!d.sub, cLabel: d.live ? S.disconnect : S.connect, cBg: d.live ? t.pc : t.pri, cFg: d.live ? t.onpc : t.onpri },
      actions: [['qr_code_2', S.actions[0]], ['share', S.actions[1]], ['create_new_folder', S.actions[2]], ['edit', S.actions[3]]].map((a) => ({ icon: a[0], label: a[1] })),
      nav: S.nav.map((label, i) => ({ label, icon: navIcon[i], href: px + navHref[i], current: i === 1 ? 'page' : 'false' }))
    };
  }
}
</script>
