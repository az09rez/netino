<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Netino for Windows — Servers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
<style>
body{margin:0}
a{color:#1A73D9}a:hover{color:#0F5BB5}
button,input{font-family:inherit}
input::placeholder{color:#5F6A7D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,Consolas,monospace}
</style>
</helmet>
<div dir="ltr" style="width: 1000px; height: 720px; box-sizing: border-box; background: #F6F8FC; color: #0F172A; font-family: 'Vazirmatn', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #DCE3EE">
  <div aria-hidden="true" style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 0 0 12px; font-size: 12px; color: #4B5567; flex-shrink: 0">
    <img src="/_blob/5644abea1ce12769d11482a20bb3cea4" alt="" style="width: 16px; height: 16px"><span style="flex-grow: 1">Netino</span>
    <span class="ms" style="font-size: 16px; width: 40px; text-align: center">remove</span><span class="ms" style="font-size: 16px; width: 40px; text-align: center">crop_square</span><span class="ms" style="font-size: 16px; width: 40px; text-align: center">close</span>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex">
    <nav aria-label="Main menu" style="width: 88px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: #EFF3F9">
      <img src="/_blob/5644abea1ce12769d11482a20bb3cea4" alt="Netino" style="width: 40px; height: 40px; margin-bottom: 12px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; width: 100%; text-decoration: none; font-size: 13px; font-weight: {{n.weight}}; color: {{n.fg}}">
          <span style="width: 64px; height: 36px; border-radius: 18px; background: {{n.pill}}; color: {{n.iconFg}}; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 28px">{{n.icon}}</span></span>{{n.label}}
        </a>
      </sc-for>
    </nav>

    <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 8px; padding: 16px 24px 12px; flex-wrap: wrap">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; flex-grow: 1">Servers</h1>
        <label style="display: flex; align-items: center; gap: 8px; height: 40px; width: 220px; padding: 0 12px; border-radius: 20px; background: #E6ECF5">
          <span class="ms" aria-hidden="true" style="font-size: 20px; color: #4B5567">search</span>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
          <input type="search" placeholder="Search" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px; color: #0F172A">
        </label>
        <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #1A73D9; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">add</span>Add</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #C3CDDC; background: transparent; color: #0F172A; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">network_check</span>Test all</button>
        <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #C3CDDC; background: transparent; color: #0F172A; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 20px">sync</span>Update</button>
      </div>

      <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 0 24px 20px; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
          <section style="border-radius: 18px; background: #EFF3F9; overflow: hidden">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px 6px 16px">
              <span class="ms" aria-hidden="true" style="font-size: 28px; color: {{sec.iconFg}}">{{sec.icon}}</span>
              <span style="font-size: 16px; font-weight: 600">{{sec.title}}</span>
              <span style="font-size: 13px; color: {{sec.metaFg}}; font-weight: {{sec.metaWeight}}">{{sec.meta}}</span>
              <span style="flex-grow: 1"></span>
              <sc-if value="{{sec.isSub}}" hint-placeholder-val="{{false}}">
                <span style="display: flex; gap: 2px">
                  <button aria-label="Test subscription" title="Test" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #4B5567"><span class="ms" aria-hidden="true" style="font-size: 20px">network_check</span></button>
                  <button aria-label="Subscription link QR" title="QR" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #4B5567"><span class="ms" aria-hidden="true" style="font-size: 20px">qr_code_2</span></button>
                  <button aria-label="Update subscription" title="Update" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #4B5567"><span class="ms" aria-hidden="true" style="font-size: 20px">sync</span></button>
                  <button aria-label="Delete subscription" title="Delete" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #C2272D"><span class="ms" aria-hidden="true" style="font-size: 20px">delete</span></button>
                </span>
              </sc-if>
            </div>
            <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 12px 4px 16px; border-top: 1px solid #DCE3EE; background: {{r.bg}}">
                <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid {{r.radio}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{r.dot}}"></span></span>
                <span style="width: 200px; font-size: 15px; font-weight: 600">{{r.name}}</span>
                <span class="mono" style="flex-grow: 1; min-width: 0; font-size: 13px; color: #4B5567; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.addr}}</span>
                <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: {{r.pBg}}; color: {{r.pFg}}; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; flex-shrink: 0">{{r.ping}}</span>
                <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: transparent; color: #1A73D9; font-size: 14px; font-weight: 600">Connect</button>
                <button aria-label="QR for {{r.name}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; color: #4B5567"><span class="ms" aria-hidden="true" style="font-size: 20px">qr_code_2</span></button>
                <button aria-label="Add {{r.name}} to group" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; color: #4B5567"><span class="ms" aria-hidden="true" style="font-size: 20px">create_new_folder</span></button>
                <button aria-label="Delete {{r.name}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; color: #4B5567"><span class="ms" aria-hidden="true" style="font-size: 20px">delete</span></button>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const good = ['#E3F5E8', '#1B7F38'], warn = ['#FEF3DC', '#9A5B00'], bad = ['#FDE4E5', '#C2272D'], none = ['#E6ECF5', '#4B5567'];
    const row = (name, addr, ping, c, sel) => ({ name, addr, ping, pBg: c[0], pFg: c[1], bg: sel ? 'rgba(214,231,255,0.7)' : 'transparent', radio: sel ? '#1A73D9' : '#6B7487', dot: sel ? '#1A73D9' : 'transparent' });
    const sec = (icon, title, meta, rows, o) => ({ icon, title, meta, rows, isSub: !!(o && o.sub), iconFg: o && o.warn ? '#9A5B00' : '#1A73D9', metaFg: o && o.warn ? '#9A5B00' : '#4B5567', metaWeight: o && o.warn ? 600 : 400 });
    return {
      sections: [
        sec('folder', 'Group: Work', '2 servers', [
          row('Turkey — SS', 'shadowsocks · tr.example.net:8388', '1.9s', bad),
          row('Netherlands — Reality', 'trojan · nl.example.com:8443', '980ms', warn)
        ]),
        sec('person', 'My servers', '3 servers', [
          row('Germany 2 — Hetzner', 'vless · 91.107.x.x:443 · ws+tls', '240ms', good, true),
          row('Finland — Hy2', 'hysteria2 · 65.21.x.x:8443', 'Failed', bad)
        ]),
        sec('bolt', 'WARP', 'Cloudflare', [
          row('WARP-in-WARP', 'wireguard · engage.cloudflareclient.com:2408', '420ms', good)
        ]),
        sec('cloud_sync', 'Subscription: My service', '42 of 50 GB · 3 days left', [
          row('Netherlands — Reality', 'trojan · nl.example.com:8443', '980ms', warn),
          row('USA — CDN', 'vmess · cdn.example.com:443', '—', none)
        ], { sub: true, warn: true })
      ],
      nav: [['Home', 'shield', 'EN-W-Home.dc.html'], ['Servers', 'dns', 'EN-W-Servers.dc.html'], ['Stats', 'bar_chart', '#'], ['Tools', 'build', 'EN-W-Tools.dc.html'], ['Settings', 'settings', 'EN-W-Settings.dc.html'], ['Log', 'receipt_long', '#']].map((n, k) => ({
        label: n[0], icon: n[1], href: n[2], current: k === 1 ? 'page' : 'false',
        pill: k === 1 ? '#D6E7FF' : 'transparent', iconFg: k === 1 ? '#0A3A73' : '#4B5567', fg: k === 1 ? '#0F172A' : '#4B5567', weight: k === 1 ? 600 : 500
      }))
    };
  }
}
</script>
</body>
</html>
