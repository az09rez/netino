<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نتینو — تنظیمات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
<style>
body{margin:0}
a{color:#1A73D9}a:hover{color:#0F5BB5}
button{font-family:inherit}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div dir="rtl" style="width: 412px; height: 915px; box-sizing: border-box; background: #F6F8FC; color: #0F172A; font-family: 'Vazirmatn', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 16px 8px; min-height: 48px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600">تنظیمات</h1>
  </header>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <ul style="list-style: none; margin: 0; padding: 4px 0; border-radius: 24px; background: #EFF3F9">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <li>
          <a href="{{c.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 8px 16px; color: #0F172A; text-decoration: none">
            <span style="width: 48px; height: 48px; border-radius: 14px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true" style="font-size: 28px">{{c.icon}}</span></span>
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 17px; font-weight: 600">{{c.title}}</span>
              <span style="font-size: 14px; color: #4B5567">{{c.sub}}</span>
            </span>
            <span class="ms" aria-hidden="true" style="color: #4B5567">chevron_left</span>
          </a>
        </li>
      </sc-for>
    </ul>

    <ul style="list-style: none; margin: 0; padding: 4px 0; border-radius: 24px; background: #EFF3F9">
      <li><a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; color: #0F172A; text-decoration: none; font-size: 16px"><span class="ms" aria-hidden="true" style="color: #4B5567">help</span><span style="flex-grow: 1">راهنما و سؤال‌های رایج</span><span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #E3F5E8; color: #1B7F38; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px"><span class="ms" aria-hidden="true" style="font-size: 16px">offline_pin</span>بدون اینترنت</span></a></li>
      <li><a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; color: #0F172A; text-decoration: none; font-size: 16px"><span class="ms" aria-hidden="true" style="color: #4B5567">receipt_long</span>گزارش شبکه</a></li>
      <li><button style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; border: 0; background: transparent; color: #C2272D; font-size: 16px; font-weight: 500; text-align: right; cursor: pointer"><span class="ms" aria-hidden="true">delete_forever</span>پاک کردن همه‌چیز</button></li>
    </ul>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0 4px">
      <img src="/_blob/5644abea1ce12769d11482a20bb3cea4" alt="لوگوی نتینو" style="width: 48px; height: 48px">
      <span style="font-size: 14px; color: #4B5567">نتینو · نسخهٔ ۲٫۱۰٫۰</span>
    </div>
  </div>

  <nav aria-label="منوی اصلی" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px 8px 16px; background: #EFF3F9">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 14px; font-weight: {{n.weight}}; color: {{n.fg}}">
        <span style="width: 72px; height: 36px; border-radius: 18px; background: {{n.pill}}; color: {{n.iconFg}}; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 28px">{{n.icon}}</span></span>
        {{n.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const blue = ['#D6E7FF', '#0A3A73'], green = ['#DDF3C8', '#2C5A08'], amber = ['#FEF3DC', '#5C3700'], purple = ['#EBDDFF', '#4A2A8A'], teal = ['#CCF0EE', '#0B5550'], rose = ['#FDE2EE', '#8A1F4C'];
    const cat = (icon, title, sub, c, href) => ({ icon, title, sub, bg: c[0], fg: c[1], href: href || '#' });
    return {
      cats: [
        cat('tune', 'عمومی', 'زبان، پوسته', blue),
        cat('auto_mode', 'اتصال هوشمند', 'صرفه‌جویی باتری، تعویض خودکار سرور', teal),
        cat('shield_lock', 'ضد فیلترینگ', 'WARP، فرگمنت، آی‌پی تمیز', green, 'A-Settings-Anti.dc.html'),
        cat('alt_route', 'مسیریابی و اشتراک‌گذاری', 'سایت‌های ایرانی مستقیم، تونل برنامه‌ها', purple),
        cat('schedule', 'خودکار', 'روشن و خاموش با شبکه یا ساعت', blue),
        cat('lock', 'حریم خصوصی و امنیت', 'DNS امن، قفل برنامه، قطع امن', rose),
        cat('backup', 'پشتیبان‌گیری', 'پشتیبان رمزدار و بازگردانی', teal),
        cat('public_off', 'اینترنت ملی', 'آماده شوید؛ اتصال ویژه', amber, 'A-National.dc.html')
      ],
      nav: [['خانه', 'shield', 'A-Home.dc.html'], ['سرورها', 'dns', 'A-Servers.dc.html'], ['مصرف', 'data_usage', 'A-Usage.dc.html'], ['تنظیمات', 'settings', 'A-Settings.dc.html']].map((n, k) => ({
        label: n[0], icon: n[1], href: n[2], current: k === 3 ? 'page' : 'false',
        pill: k === 3 ? '#D6E7FF' : 'transparent', iconFg: k === 3 ? '#0A3A73' : '#4B5567', fg: k === 3 ? '#0F172A' : '#4B5567', weight: k === 3 ? 600 : 500
      }))
    };
  }
}
</script>
</body>
</html>
