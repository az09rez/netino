<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Netino — Usage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=block">
<style>
body{margin:0}
a{color:#6AB0FF}a:hover{color:#9CCBFF}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div dir="ltr" style="width: 412px; height: 915px; box-sizing: border-box; background: {{t.bg}}; color: {{t.on}}; font-family: 'Vazirmatn', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 16px 8px; min-height: 48px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600">Usage</h1>
  </header>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{tiles}}" as="k" hint-placeholder-count="4">
        <div style="border-radius: 18px; background: {{t.sc}}; padding: 14px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 14px; color: {{t.onv}}">{{k.label}}</span>
          <span style="font-size: 24px; font-weight: 700">{{k.total}}</span>
          <span style="font-size: 13px; color: {{t.onv}}">↓ {{k.down}} · ↑ {{k.up}}</span>
        </div>
      </sc-for>
    </div>

    <section style="border-radius: 24px; background: {{t.sc}}; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <h2 style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600">Last 30 days</h2>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: {{t.onv}}"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.dl}}"></span>Download</span>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: {{t.onv}}"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.ul}}"></span>Upload</span>
      </div>
      <div role="img" aria-label="Usage chart for the last 30 days; peak 1.4 GB" style="display: flex; align-items: flex-end; gap: 3px; height: 150px; border-bottom: 1px solid {{t.outline}}">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="30">
          <span style="flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; height: 100%">
            <span style="height: {{b.u}}%; background: {{t.ul}}; border-radius: 2px 2px 0 0"></span>
            <span style="height: {{b.d}}%; background: {{t.dl}}"></span>
          </span>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: {{t.onv}}"><span>30 days ago</span><span>15 days ago</span><span>Today</span></div>
    </section>

    <section style="border-radius: 24px; background: {{t.sc}}; padding: 4px 0">
      <h2 style="margin: 0; padding: 12px 16px 4px; font-size: 18px; font-weight: 600">Daily</h2>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
          <li style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-top: 1px solid {{t.outline}}">
            <span style="flex-grow: 1; font-size: 16px">{{d.label}}</span>
            <span style="font-size: 13px; color: {{t.onv}}">↓ {{d.down}} · ↑ {{d.up}}</span>
            <span style="font-size: 16px; font-weight: 600; width: 72px; text-align: right">{{d.total}}</span>
          </li>
        </sc-for>
      </ul>
    </section>
  </div>

  <nav aria-label="Main menu" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px 8px 16px; background: {{t.sc}}">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; text-decoration: none; font-size: 14px; font-weight: {{n.weight}}; color: {{n.fg}}">
        <span style="width: 72px; height: 36px; border-radius: 18px; background: {{n.pill}}; color: {{n.iconFg}}; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true" style="font-size: 28px">{{n.icon}}</span></span>
        {{n.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const t = dark
      ? { bg: '#0A0F1C', sc: '#131B2D', on: '#E5EAF3', onv: '#9AA6BA', outline: '#253047', dl: '#6AB0FF', ul: '#9BE05A', pc: '#0D3F78', onPc: '#D6E7FF' }
      : { bg: '#F6F8FC', sc: '#EFF3F9', on: '#0F172A', onv: '#4B5567', outline: '#DCE3EE', dl: '#1A73D9', ul: '#4E9A12', pc: '#D6E7FF', onPc: '#0A3A73' };
    const bars = [];
    for (let i = 29; i >= 0; i--) {
      const v = 25 + ((i * 37) % 50) + (i % 7 === 5 ? 20 : 0);
      bars.push({ d: Math.round(v * 0.8), u: Math.round(v * 0.2) });
    }
    return {
      t,
      bars,
      tiles: [
        { label: 'Today', total: '412 MB', down: '356 MB', up: '56 MB' },
        { label: 'Last 7 days', total: '3.8 GB', down: '3.2 GB', up: '0.6 GB' },
        { label: 'This month', total: '11.6 GB', down: '9.9 GB', up: '1.7 GB' },
        { label: 'Last 30 days', total: '16.2 GB', down: '13.8 GB', up: '2.4 GB' }
      ],
      days: [
        { label: 'Today', total: '412 MB', down: '356 MB', up: '56 MB' },
        { label: 'Yesterday', total: '640 MB', down: '560 MB', up: '80 MB' },
        { label: 'Monday', total: '1.4 GB', down: '1.2 GB', up: '0.2 GB' },
        { label: 'Sunday', total: '520 MB', down: '450 MB', up: '70 MB' },
        { label: 'Saturday', total: '380 MB', down: '330 MB', up: '50 MB' }
      ],
      nav: [['Home', 'shield', 'EN-A-Home.dc.html'], ['Servers', 'dns', 'EN-A-Servers.dc.html'], ['Usage', 'data_usage', 'EN-A-Usage.dc.html'], ['Settings', 'settings', 'EN-A-Settings.dc.html']].map((n, k) => ({
        label: n[0], icon: n[1], href: n[2], current: k === 2 ? 'page' : 'false',
        pill: k === 2 ? t.pc : 'transparent', iconFg: k === 2 ? t.onPc : t.onv, fg: k === 2 ? t.on : t.onv, weight: k === 2 ? 600 : 500
      }))
    };
  }
}
</script>
</body>
</html>
