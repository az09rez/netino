      conn: [['seg', 'mode', 'Connection type', 'Full tunnel sends every app through Netino and needs admin access', ['System proxy', 'Full tunnel']],
        tun ? ['switch', 'kill', 'Kill switch', 'If the tunnel drops, keep the internet blocked'] : ['switch', 'setProxy', 'Set Windows proxy', 'Point the system proxy at Netino while connected'],
        ['switch', 'boot', 'Start with Windows', 'Netino opens in the system tray'], ['switch', 'autoc', 'Connect on launch', 'To the last server or the fastest'],
        ['switch', 'tray', 'Closing the window goes to tray', 'Netino stays connected in the background'], ['switch', 'autoswitch', 'Switch server automatically', 'When the current server is slow or drops'],
        ['switch', 'iran', 'Iranian sites direct', 'Domestic sites open without the VPN'], ['switch', 'ads', 'Block ads', 'Block ads and trackers']],
      anti: [['switch', 'frag', 'TLS fragment', 'The first packet is sent in pieces so the filter cannot recognize it'], ['btn', 'clean', 'Clean Cloudflare IP', 'Last result: 12 healthy IPs · today', 'Scan'],
        ['seg', 'warpType', 'WARP type', '', ['Plain', 'WARP-in-WARP']], ['seg', 'warpExit', 'Exit through WARP', 'Which sites leave through WARP', ['Off', 'Some sites', 'All']],
        ['btn', 'warpKey', 'WARP+ key', 'Optional; faster speeds', 'Enter key'], ['btn', 'warpMake', 'Create WARP servers', 'A free Cloudflare account is created and added', 'Create']],
      route: [['btn', 'apps', 'Direct apps', 'Telegram.exe, Steam.exe and 1 more', 'Manage'], ['seg', 'sites', 'Sites and IPs', '', ['Off', 'These go direct', 'Only these via VPN']],
        ['btn', 'list', 'Site and IP list', '3 entries', 'Edit'], ['btn', 'iranLists', 'Iran lists', 'Updated: Oct 4', 'Download']],
      share: [['switch', 'shareOn', 'Share connection', 'Phones and devices on this network can use Netino'], ['info', 'http', 'HTTP', '', '192.168.1.24:10809'], ['info', 'socks', 'SOCKS', '', '192.168.1.24:10808'],
        ['btn', 'pass', 'Password', 'Optional; recommended on public networks', 'Set'], ['btn', 'qr', 'QR for phone', 'Scan to set up your phone automatically', 'Show QR']],
      privacy: [['switch', 'help', 'Help the free list', 'Only which config worked is sent, anonymously'], ['switch', 'notif', 'Windows notifications', 'Disconnects, server switches, subscription end and updates'],
        ['btn', 'hotkey', 'Connect shortcut', 'Ctrl + Alt + N', 'Change']],
      backup: [['btn', 'make', 'Create backup', 'Encrypted .nbk file, the same as on the phone', 'Create'], ['btn', 'restore', 'Restore', 'From a .nbk file', 'Choose file']],
      debug: [['btn', 'log', 'Live log', 'Connection events as they happen', 'Open'], ['btn', 'copyRep', 'Network report', 'To send to support', 'Copy'], ['btn', 'send', 'Send to developer', 'Optional note; no personal data', 'Send']],
      about: [['info', 'ver', 'Version', '', '2.10.0'], ['btn', 'upd', 'Update', 'Version 2.11 is ready', 'Install'], ['btn', 'helpDoc', 'Help', 'Works offline · F1', 'Open']]
    };
    const catTitle = {};
    C.forEach((c) => { catTitle[c[0]] = c[2]; });
    const cat = this.state.cat ?? this.props.cat ?? 'conn';
    const q = this.state.query.trim().toLowerCase();
    let list;
    if (q) {
      list = [];
      C.forEach((c) => R[c[0]].forEach((r) => { if ((r[2] + ' ' + (r[3] || '')).toLowerCase().includes(q)) list.push([...r, catTitle[c[0]]]); }));
    } else list = R[cat];
    const mk = (r, i) => {
      const [type, key, label, hint, extra, where] = r;
      const base = { id: 'set-' + key, label, hint: hint || '', hasHint: !!hint, where: where || '', hasWhere: !!where, div: i ? '1px solid var(--line)' : '0',
        isSwitch: type === 'switch', isSeg: type === 'seg', isBtn: type === 'btn', isSelect: type === 'select', isInfo: type === 'info', opts: [] };
      if (type === 'switch') {
        const on = !!this.state.sw[key];
        Object.assign(base, { on, track: on ? t.pri : 'transparent', border: on ? t.pri : t.off, knob: on ? t.onpri : t.off,
          side: (on === fa) ? 'left' : 'right', off: on ? 2 : 5, k: on ? 20 : 14, mt: on ? -10 : -7,
          flip: () => this.setState({ sw: { ...this.state.sw, [key]: !on } }) });
      }
      if (type === 'seg') base.opts = extra.map((label, j) => {
        const on = this.state.seg[key] === j;
        return { label, on, bg: on ? t.card : 'transparent', fg: on ? t.on : t.onv, w: on ? 600 : 500, shadow: on ? '0 1px 3px rgba(15,23,42,0.15)' : 'none', pick: () => this.setState({ seg: { ...this.state.seg, [key]: j } }) };
      });
      if (type === 'btn') base.btn = extra;
      if (type === 'select' || type === 'info') base.value = extra;
      return base;
    };
    const curCat = C.find((c) => c[0] === cat);
    const px = fa ? '' : 'EN-';
    const navHref = ['W-Home.dc.html', 'W-Servers.dc.html', 'W-Usage.dc.html', 'W-Settings.dc.html'];
    const navIcon = ['shield', 'dns', 'data_usage', 'settings'];
    return {
      s: S, t, px,
      dir: fa ? 'rtl' : 'ltr',
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      head: q ? { title: S.resultsTitle, desc: S.resultsDesc } : { title: curCat[2], desc: curCat[3] },
      cats: C.map((c) => {
        const on = !q && c[0] === cat;
        return { id: c[0], icon: c[1], label: c[2], on, bg: on ? t.pc : 'transparent', fg: on ? t.onpc : t.on, iconFg: on ? t.onpc : t.onv, w: on ? 600 : 500,
          pick: () => this.setState({ cat: c[0], query: '' }) };
      }),
      rows: list.map(mk),
      noRows: list.length === 0,
      nav: S.nav.map((label, i) => ({ label, icon: navIcon[i], href: px + navHref[i], current: i === 3 ? 'page' : 'false' }))
    };
  }
}
